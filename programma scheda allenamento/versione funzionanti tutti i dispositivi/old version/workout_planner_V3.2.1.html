<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-6">
  <div class="max-w-6xl mx-auto" id="app">
    <div class="bg-gradient-to-br from-orange-500 to-red-600 rounded-xl shadow-2xl p-8 mb-6">
      <h1 class="text-4xl font-black text-white mb-2 text-center tracking-tight">💪 WORKOUT PLANNER</h1>
      <p class="text-orange-100 text-center font-semibold">Personal Training Program</p>
      <div class="grid md:grid-cols-2 gap-6 mt-6">
        <div>
          <label class="block text-sm font-bold text-white mb-2 uppercase tracking-wide">🏃 Atleta</label>
          <input id="clientName" type="text" class="w-full px-4 py-3 bg-white/90 border-2 border-orange-300 rounded-lg focus:border-orange-400 focus:outline-none font-semibold text-lg" placeholder="Nome dell'atleta" />
        </div>
        <div>
          <label class="block text-sm font-bold text-white mb-2 uppercase tracking-wide">🎯 Logo PT</label>
          <label for="logoInput" id="uploadLabel" class="flex items-center justify-center w-full px-4 py-3 bg-white/20 border-2 border-white/40 border-dashed rounded-lg cursor-pointer hover:bg-white/30 transition">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span class="text-sm text-white font-semibold ml-2">Upload Logo</span>
            <input id="logoInput" type="file" accept="image/*" class="hidden" />
          </label>
        </div>
      </div>
      <div id="logoPreviewWrap" class="hidden flex gap-6 mt-6 pt-6 border-t border-white/30">
        <div class="text-center mx-auto">
          <p class="text-sm text-white font-semibold mb-2">Preview Logo</p>
          <img id="logoPreview" alt="Logo" class="max-w-32 max-h-20 mx-auto border-2 border-white/50 rounded bg-white/10 p-2" />
        </div>
      </div>
    </div>

    <div id="weeksContainer"></div>

    <div class="text-center">
      <button id="generatePDFBtn" class="inline-flex items-center gap-3 px-10 py-5 bg-gradient-to-r from-green-600 to-emerald-600 text-white text-xl font-black rounded-xl hover:from-green-700 hover:to-emerald-700 transition shadow-2xl uppercase tracking-wide">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Genera PDF
      </button>
    </div>
  </div>

<script>
// Dati iniziali
const state = {
  clientName: '',
  logo: '',
  weeks: [
    {
      id: 1,
      days: [
        { id: 1, name: 'Lunedì', exercises: [] },
        { id: 2, name: 'Martedì', exercises: [] },
        { id: 3, name: 'Mercoledì', exercises: [] },
        { id: 4, name: 'Giovedì', exercises: [] },
        { id: 5, name: 'Venerdì', exercises: [] },
        { id: 6, name: 'Sabato', exercises: [] },
        { id: 7, name: 'Domenica', exercises: [] }
      ]
    }
  ]
};

const EXERCISE_LIBRARY = {
  mobility: [
    { name: "FOAM ROLLER" },
    { name: "SHOULDER" },
    { name: "LEG LOWER" },
    { name: "LEG LOWER RGR" },
    { name: "CUFFIE ROTATORI RNT" },
    { name: "ANKLE MOBILITY" },
    { name: "ANKLE MOBILITY LATERAL" },
    { name: "CAT COW" },
    { name: "TOE TOUCH" },
    { name: "SL DEADLIFT" },
    { name: "SUMO SQUAT" },
    { name: "LEG LOWER LATERAL" }
  ],
  strength: [
    { name: "PUSH UP"},
    { name: "BENCH PRESS" },
    { name: "BENCH PRESS BB" },
    { name: "CROCI" },
    { name: "SQUAT PRESS OUT" },
    { name: "GOBLET SOUAT" },
    { name: "BACK SQUAT" },
    { name: "ROW" },
    { name: "ROW BB" },
    { name: "ROW 1 ARM" },
    { name: "SL DEADLIFT" },
    { name: "TRAP BAR" },
    { name: "DEADLIFT KETBALL" },
    { name: "CURL" }
  ]
};

const weeksContainer = document.getElementById('weeksContainer');
const clientNameInput = document.getElementById('clientName');
const logoInput = document.getElementById('logoInput');
const logoPreview = document.getElementById('logoPreview');
const logoPreviewWrap = document.getElementById('logoPreviewWrap');
const generatePDFBtn = document.getElementById('generatePDFBtn');

clientNameInput.addEventListener('input', (e) => {
  state.clientName = e.target.value;
});

logoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.logo = ev.target.result;
    logoPreview.src = state.logo;
    logoPreviewWrap.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});

function createIconPlus() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','16'); svg.setAttribute('height','16'); svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','2');
  const line1 = document.createElementNS('http://www.w3.org/2000/svg','line'); line1.setAttribute('x1','12'); line1.setAttribute('y1','5'); line1.setAttribute('x2','12'); line1.setAttribute('y2','19');
  const line2 = document.createElementNS('http://www.w3.org/2000/svg','line'); line2.setAttribute('x1','5'); line2.setAttribute('y1','12'); line2.setAttribute('x2','19'); line2.setAttribute('y2','12');
  svg.appendChild(line1); svg.appendChild(line2);
  return svg;
}

function createIconTrash() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','16'); svg.setAttribute('height','16'); svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','2');
  const poly = document.createElementNS('http://www.w3.org/2000/svg','polyline'); poly.setAttribute('points','3 6 5 6 21 6');
  const path = document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d','M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2');
  const l1 = document.createElementNS('http://www.w3.org/2000/svg','line'); l1.setAttribute('x1','10'); l1.setAttribute('y1','11'); l1.setAttribute('x2','10'); l1.setAttribute('y2','17');
  const l2 = document.createElementNS('http://www.w3.org/2000/svg','line'); l2.setAttribute('x1','14'); l2.setAttribute('y1','11'); l2.setAttribute('x2','14'); l2.setAttribute('y2','17');
  svg.appendChild(poly); svg.appendChild(path); svg.appendChild(l1); svg.appendChild(l2);
  return svg;
}

function dayToDOM(weekIndex, dayIndex) {
  const day = state.weeks[weekIndex].days[dayIndex];
  const wrap = document.createElement('div');
  wrap.className = 'mb-8 pb-8 border-b border-slate-700 last:border-b-0';

  const header = document.createElement('div');
  header.className = 'flex justify-between items-center mb-4';
  const h3 = document.createElement('h3');
  h3.className = 'text-xl font-black text-white uppercase tracking-wide';
  h3.textContent = day.name;

  header.appendChild(h3);
  wrap.appendChild(header);

  if (day.exercises.length === 0) {
    const p = document.createElement('p');
    p.className = 'text-slate-500 italic ml-4 font-semibold mb-4';
    p.textContent = '💤 Giorno di riposo';
    wrap.appendChild(p);
  } else {
    const container = document.createElement('div');
    container.className = 'space-y-4 mb-4';
    day.exercises.forEach((exercise, exIndex) => {
      const exWrap = document.createElement('div');
      exWrap.className = 'bg-slate-700 p-4 rounded-lg border-l-4 border-orange-500 shadow-lg';
      const grid = document.createElement('div');
      grid.className = 'grid md:grid-cols-12 gap-3 items-start';

      // --- Nome esercizio: select + input ---
        const nameContainer = document.createElement('div');
        nameContainer.className = 'md:col-span-5 flex gap-2';

        // SELECT predefiniti
        const nameSelect = document.createElement('select');
        nameSelect.className =
          'flex-1 px-3 py-2 bg-slate-600 text-white border-2 border-slate-500 rounded focus:border-orange-500 focus:outline-none font-semibold';

        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = 'Seleziona esercizio';
        nameSelect.appendChild(emptyOption);

        // Gruppo MOBILITY
        const mobilityGroup = document.createElement('optgroup');
        mobilityGroup.label = '🧘 MOBILITY';
        EXERCISE_LIBRARY.mobility.forEach((ex, i) => {
          const opt = document.createElement('option');
          opt.value = 'mobility-' + i;
          opt.textContent = ex.name;
          mobilityGroup.appendChild(opt);
        });
        nameSelect.appendChild(mobilityGroup);

        // Gruppo STRENGTH
        const strengthGroup = document.createElement('optgroup');
        strengthGroup.label = '💪 STRENGTH';
        EXERCISE_LIBRARY.strength.forEach((ex, i) => {
          const opt = document.createElement('option');
          opt.value = 'strength-' + i;
          opt.textContent = ex.name;
          strengthGroup.appendChild(opt);
        });
        nameSelect.appendChild(strengthGroup);

        // INPUT libero
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = exercise.name;
        nameInput.placeholder = 'Scrivi esercizio';
        nameInput.className =
          'flex-1 px-3 py-2 bg-slate-600 text-white border-2 border-slate-500 rounded focus:border-orange-500 focus:outline-none font-semibold';

        // Cambio select → autocompila
        nameSelect.addEventListener('change', (e) => {
          const value = e.target.value;
          if (!value) return;

          const [category, index] = value.split('-');
          const selected = EXERCISE_LIBRARY[category][index];
          if (!selected) return;

          nameInput.value = selected.name;
          setsInput.value = selected.sets;
          repsInput.value = selected.reps;
          restInput.value = selected.rest;
          notesInput.value = selected.notes;

          updateExercise(weekIndex, dayIndex, exIndex, 'name', selected.name);
          updateExercise(weekIndex, dayIndex, exIndex, 'sets', selected.sets);
          updateExercise(weekIndex, dayIndex, exIndex, 'reps', selected.reps);
          updateExercise(weekIndex, dayIndex, exIndex, 'rest', selected.rest);
          updateExercise(weekIndex, dayIndex, exIndex, 'notes', selected.notes);

          renderWeeks();
        });

        // Scrittura manuale
        nameInput.addEventListener('input', (e) => {
          updateExercise(weekIndex, dayIndex, exIndex, 'name', e.target.value);
        });

        nameContainer.appendChild(nameSelect);
        nameContainer.appendChild(nameInput);



      const setsInput = document.createElement('input');
      setsInput.type = 'text';
      setsInput.value = exercise.sets;
      setsInput.placeholder = 'Serie';
      setsInput.className = 'md:col-span-2 md:ml-3 px-3 py-2 bg-slate-600 text-white border-2 border-slate-500 rounded focus:border-orange-500 focus:outline-none font-semibold placeholder-slate-400';
      setsInput.addEventListener('input', (e) => updateExercise(weekIndex, dayIndex, exIndex, 'sets', e.target.value));

      const repsInput = document.createElement('input');
      repsInput.type = 'text';
      repsInput.value = exercise.reps;
      repsInput.placeholder = 'Rip.';
      repsInput.className = 'md:col-span-2 px-3 py-2 bg-slate-600 text-white border-2 border-slate-500 rounded focus:border-orange-500 focus:outline-none font-semibold placeholder-slate-400';
      repsInput.addEventListener('input', (e) => updateExercise(weekIndex, dayIndex, exIndex, 'reps', e.target.value));

      const restInput = document.createElement('input');
      restInput.type = 'text';
      restInput.value = exercise.rest;
      restInput.placeholder = 'Recupero';
      restInput.className = 'md:col-span-2 px-3 py-2 bg-slate-600 text-white border-2 border-slate-500 rounded focus:border-orange-500 focus:outline-none font-semibold placeholder-slate-400';
      restInput.addEventListener('input', (e) => updateExercise(weekIndex, dayIndex, exIndex, 'rest', e.target.value));

      const trashBtn = document.createElement('button');
      trashBtn.className = 'md:col-span-1 flex items-center justify-center h-10 w-10 bg-red-600 text-white rounded hover:bg-red-700 transition';
      const trashIcon = createIconTrash();
      trashBtn.appendChild(trashIcon);
      trashBtn.addEventListener('click', () => removeExercise(weekIndex, dayIndex, exIndex));

      const notesInput = document.createElement('input');
      notesInput.type = 'text';
      notesInput.value = exercise.notes;
      notesInput.placeholder = '📝 Note aggiuntive (tempo, tecnica, ecc.)';
      notesInput.className = 'md:col-span-12 px-3 py-2 bg-slate-600 text-white border-2 border-slate-500 rounded focus:border-orange-500 focus:outline-none font-semibold placeholder-slate-400';
      notesInput.addEventListener('input', (e) => updateExercise(weekIndex, dayIndex, exIndex, 'notes', e.target.value));

      grid.appendChild(nameContainer);
      grid.appendChild(setsInput);
      grid.appendChild(repsInput);
      grid.appendChild(restInput);
      grid.appendChild(trashBtn);
      grid.appendChild(notesInput);
      exWrap.appendChild(grid);
      container.appendChild(exWrap);
    });
    wrap.appendChild(container);
  }

  // Pulsante Aggiungi sempre in fondo centrato
  const addBtnContainer = document.createElement('div');
  addBtnContainer.className = 'flex justify-center';
  const addBtn = document.createElement('button');
  addBtn.className = 'flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold rounded-lg hover:from-orange-600 hover:to-red-700 transition shadow-lg uppercase text-sm';
  addBtn.appendChild(createIconPlus());
  const span = document.createElement('span'); span.className = 'ml-2'; span.textContent = 'Aggiungi'; addBtn.appendChild(span);
  addBtn.addEventListener('click', () => {
    addExercise(weekIndex, dayIndex);
  });
  addBtnContainer.appendChild(addBtn);
  wrap.appendChild(addBtnContainer);

  return wrap;
}

function renderWeeks() {
  weeksContainer.innerHTML = '';
  state.weeks.forEach((week, weekIndex) => {
    const weekWrap = document.createElement('div');
    weekWrap.className = 'bg-slate-800 rounded-xl shadow-2xl p-8 mb-6 border-2 border-orange-500/30';

    const h2 = document.createElement('h2');
    h2.className = 'text-2xl font-black text-orange-500 mb-6 uppercase tracking-wider flex items-center gap-3';
    h2.innerHTML = '<span class="text-3xl">🔥</span> Settimana ' + (weekIndex + 1);
    weekWrap.appendChild(h2);

    week.days.forEach((day, dayIndex) => {
      weekWrap.appendChild(dayToDOM(weekIndex, dayIndex));
    });

    weeksContainer.appendChild(weekWrap);
  });
}

function addExercise(weekIndex, dayIndex) {
  const newExercise = { id: Date.now(), name: '', sets: '', reps: '', rest: '', notes: '' };
  state.weeks[weekIndex].days[dayIndex].exercises.push(newExercise);
  renderWeeks();
}

function updateExercise(weekIndex, dayIndex, exerciseIndex, field, value) {
  state.weeks[weekIndex].days[dayIndex].exercises[exerciseIndex][field] = value;
  // no need to fully re-render for each keystroke; inputs show their own value
}

function removeExercise(weekIndex, dayIndex, exerciseIndex) {
  state.weeks[weekIndex].days[dayIndex].exercises.splice(exerciseIndex, 1);
  renderWeeks();
}

function generatePDFContent() {
  const logo = state.logo ? `<img src="${state.logo}" class="logo" alt="Logo">` : '';
  const clientName = state.clientName || '';
  const weeksHtml = state.weeks.map((week, wIndex) => {
    const daysHtml = week.days.filter(day => day.exercises.length > 0).map(day => {
      const exercisesHtml = day.exercises.map(ex => {
        const name = ex.name || 'Esercizio';
        const details = []
        if (ex.sets) details.push('<strong>Serie:</strong> ' + ex.sets);
        if (ex.reps) details.push('<strong>Ripetizioni:</strong> ' + ex.reps);
        if (ex.rest) details.push('<strong>Recupero:</strong> ' + ex.rest);
        const detailStr = details.join(' | ');
        const notes = ex.notes ? `<div class="exercise-notes">Note: ${ex.notes}</div>` : '';
        return `
        <div class="exercise">
          <div class="exercise-name">${name}</div>
          <div class="exercise-details">${detailStr}</div>
          ${notes}
        </div>`;
      }).join('');
      return `
      <div class="day">
        <div class="day-name">${day.name}</div>
        ${exercisesHtml}
      </div>`;
    }).join('');

    return `
    <div class="week">
      ${state.weeks.length > 1 ? `<div class="week-title">🔥 SETTIMANA ${wIndex + 1}</div>` : ''}
      ${daysHtml}
    </div>`;
  }).join('');

  const html = `
  <!DOCTYPE html>
  <html>
  <head>
    <meta charset="utf-8" />
    <title>Scheda Allenamento - ${clientName}</title>
    <style>
      @page { margin: 0.5cm; size: A4; }
      body { font-family: Arial, sans-serif; margin: 0; padding: 10px; font-size: 10px; }
      .header { display:flex; justify-content: space-between; align-items:center; margin-bottom:15px; background: linear-gradient(135deg, #8bc972 0%, #000000 100%); padding:12px; margin: -10px -10px 15px -10px; border-bottom: 3px solid #8bc972; }
      .logo { max-width:80px; max-height:50px; background:white; padding:5px; border-radius:4px; }
      .client-name { font-size:20px; font-weight:900; color:white; text-align:center; flex-grow:1; text-transform:uppercase; letter-spacing:1px; }
      .week { margin-bottom:12px; border:2px solid #8bc972; padding:8px; border-radius:6px; background:#fff7ed; page-break-inside: avoid; }
      .week-title { font-size:14px; font-weight:900; color:#8bc972; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px; }
      .day { margin-bottom:10px; }
      .day-name { font-size:11px; font-weight:900; color:white; background: linear-gradient(135deg, #8bc972 0%, #000000 100%); padding:4px 8px; margin-bottom:5px; border-radius:3px; text-transform:uppercase; }
      .exercise { margin-left:10px; margin-bottom:5px; padding:5px 8px; background-color:white; border-left:3px solid #8bc972; border-radius:3px; display:flex; align-items:flex-start; gap:8px; }
      .exercise-name { font-weight:900; color:#1f2937; font-size:10px; margin-bottom:2px; text-transform:uppercase; }
      .exercise-details { color:#4b5563; font-size:9px; line-height:1.3; font-weight:600; }
      .exercise-notes { color:#6b7280; font-style:italic; font-size:8px; margin-top:2px; }
    </style>
  </head>
  <body>
    <div class="header">
      <div style="width:150px;">${logo}</div>
      <div class="client-name">PIANO ALLENAMENTO ${clientName ? '- ' + clientName.toUpperCase() : ''}</div>
      <div style="width:150px;"></div>
    </div>
    ${weeksHtml || '<p style="color:#6b7280;font-style:italic;">Nessun esercizio aggiunto.</p>'}
  </body>
  </html>`;

  return html;
}

generatePDFBtn.addEventListener('click', () => {
  const html = generatePDFContent();
  const printWindow = window.open('', '_blank');
  if (!printWindow) {
    alert('Popup bloccato: abilita i popup per generare il PDF.');
    return;
  }
  printWindow.document.write(html);
  printWindow.document.close();
  setTimeout(() => printWindow.focus() || printWindow.print(), 300);
});

// Render iniziale
renderWeeks();

</script>
</body>
</html>
